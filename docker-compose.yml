services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ptm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required in .env}
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - ptm-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ptm-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProjectTaskManager;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required in .env}
      Jwt__Issuer: ${JWT_ISSUER:-ProjectTaskManager.API}
      Jwt__Audience: ${JWT_AUDIENCE:-ProjectTaskManager.Client}
      Jwt__AccessTokenExpirationMinutes: ${ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      Jwt__RefreshTokenExpirationDays: ${REFRESH_TOKEN_EXPIRY_DAYS:-7}
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - ptm-network

volumes:
  sqlserver_data:

networks:
  ptm-network:
    driver: bridge
